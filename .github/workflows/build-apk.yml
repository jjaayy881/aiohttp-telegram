name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write  # nötig, damit der Workflow ein Release erstellen/aktualisieren darf

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Java 17 einrichten
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Python 3.10 einrichten
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Spezifische Gradle-Version (8.7) einrichten
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7' # Genau die Version, die dein Android-Plugin verlangt!

      # 5. APK bauen
      - name: Build Debug APK
        run: gradle assembleDebug

      # 6. Die fertige APK als GitHub-Release veröffentlichen statt als
      # Actions-Artefakt hochzuladen - Release-Anhänge zählen NICHT gegen
      # das 500-MB-Actions-Speicherkontingent, das uns zuletzt blockiert hat.
      # "latest" als fester Tag -> überschreibt bei jedem Push denselben
      # Release, statt sich mit der Zeit aufzustapeln.
      - name: Publish APK as GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "Neuester Build"
          body: "Automatisch gebaut aus Commit ${{ github.sha }}"
          artifacts: "app/build/outputs/apk/debug/*.apk"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
